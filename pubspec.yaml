name: status_studio
description: "Turn any video into a status clip, picked line by line from its script."
publish_to: "none"
version: 0.1.6+7

environment:
  sdk: ^3.13.7
  flutter: ">=3.47.8"

dependencies:
  flutter:
    sdk: flutter
  crypto: ^3.0.8
  meta: ^1.16.0
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.1
  video_player: ^2.14.1
  path_provider: ^2.1.6
  share_plus: ^13.3.1
  gal: ^2.3.3
  shared_preferences: ^2.5.6
  ffmpeg_kit_flutter_new_min: ^2.1.0
  flutter_foreground_task: ^11.0.3
  flutter_local_notifications: ^22.3.3
  flutter_secure_storage: ^11.2.0
  image_picker: ^1.2.4
  tflite_flutter: ^0.12.1
  url_launcher: ^6.3.3
  device_info_plus: ^13.3.0
  package_info_plus: ^10.2.2
  connectivity_plus: ^7.3.2
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0

# 2.5.x unregisters its one shared "data_store" instance whenever any Flutter
# engine detaches. The foreground service's engine detaches when a script or an
# export ends, after which every preferences read in the app throws "No
# instance named data_store has been registered". 2.4.x unregisters per
# engine. Remove this when the plugin stops sharing the instance.
dependency_overrides:
  shared_preferences_android: 2.4.26

dev_dependencies:
  flutter_test:
    sdk: flutter
  shared_preferences_platform_interface: ^2.4.2
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  freezed: ^4.0.3
  json_serializable: ^6.15.2
  build_runner: ^2.17.1

flutter:
  uses-material-design: true
  assets:
    # EfficientDet-Lite0 (Apache 2.0, TF Hub) for the body choice, spec FR-27.
    - assets/models/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
    - family: NotoNastaliqUrdu
      fonts:
        - asset: assets/fonts/NotoNastaliqUrdu.ttf
    - family: NotoNaskhArabic
      fonts:
        - asset: assets/fonts/NotoNaskhArabic.ttf
