name: status_studio
description: "Turn any video into a status clip, picked line by line from its script."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7
  flutter: ">=3.47.8"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.1
  youtube_explode_dart: ^3.1.0
  video_player: ^2.14.1
  path_provider: ^2.1.6
  share_plus: ^13.3.1
  gal: ^2.3.3
  google_mlkit_translation: ^0.15.1
  whisper_ggml: ^2.8.1
  ffmpeg_kit_flutter_new_min: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
    - family: NotoNastaliqUrdu
      fonts:
        - asset: assets/fonts/NotoNastaliqUrdu.ttf
    - family: NotoNaskhArabic
      fonts:
        - asset: assets/fonts/NotoNaskhArabic.ttf
