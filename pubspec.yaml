name: status_studio
description: "Turn any video into a status clip, picked line by line from its script."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.13.7
  flutter: ">=3.47.8"

dependencies:
  flutter:
    sdk: flutter
  crypto: ^3.0.8
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.1
  video_player: ^2.14.1
  path_provider: ^2.1.6
  share_plus: ^13.3.1
  gal: ^2.3.3
  shared_preferences: ^2.5.6
  google_mlkit_translation: ^0.15.1
  ffmpeg_kit_flutter_new_min: ^2.1.0
  flutter_foreground_task: ^11.0.3
  flutter_local_notifications: ^22.3.3
  flutter_secure_storage: ^11.2.0
  google_mlkit_face_detection: ^0.15.1
  image_picker: ^1.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  shared_preferences_platform_interface: ^2.4.2
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
    - family: NotoNastaliqUrdu
      fonts:
        - asset: assets/fonts/NotoNastaliqUrdu.ttf
    - family: NotoNaskhArabic
      fonts:
        - asset: assets/fonts/NotoNaskhArabic.ttf
