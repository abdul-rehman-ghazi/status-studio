# Regenerate with `fvm dart run flutter_launcher_icons` after
# `fvm flutter test tool/export_logo_test.dart` (spec §7 logo).
flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/branding/logo_1024.png"
  adaptive_icon_background: "#3DD68C"
  adaptive_icon_foreground: "assets/branding/logo_foreground_1024.png"
  remove_alpha_ios: true
  min_sdk_android: 24
